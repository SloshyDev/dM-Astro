query HomeQuery($locale: I18NLocaleCode) {
  home(locale: $locale) {
    Carrousel {
      ... on ComponentImageWithLinkImageWithLink {
        Link
        TypeOfLink
        Title
        Image {
          formats
          url
          height
          width
          hash
        }
      }
      ... on ComponentDataContentDataContent {
        data_contents {
          Slug
          Title
          Banner {
            formats
            url
            height
            width
            hash
          }
        }
      }
    }
    latest_news {
      Title
      Image {
        url
        width
        height
        formats
      }
      Link
      TypeOfLink
    }
    Promos {
      ... on ComponentDataContentDataContent {
        data_contents {
          Slug
          Promo {
            url
            width
            height
            formats
            hash
          }
        }
      }
      ... on ComponentImageWithLinkImageWithLink {
        Link
        TypeOfLink
        Image {
          url
          width
          height
          hash
          formats
        }
      }
    }
  }
}
